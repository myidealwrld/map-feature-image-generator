[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "map-feature-image-generator"
version = "0.1.0"
description = "Generate static featured images from slippy-map tiles, markers, and routes"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["Pillow>=10"]

[project.scripts]
map-feature-image = "map_feature_image_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
